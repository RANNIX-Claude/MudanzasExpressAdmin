<style>

  .btn{padding:0.8rem 1rem;border-radius:10px;border:none;font-size:0.95rem;font-weight:700;cursor:pointer;width:100%;}
  .btn-img{background:var(--azul);color:white;font-size:1rem;}
  .btn-wa{background:#25D366;color:white;}

const AZUL='#1B3F7A';
const AZUL_MED='#2451A0';
const NARANJA='#E87722';

let nombreActual='';

function capitalizar(s){return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
function limpiarTel(t){let n=t.replace(/\D/g,'');if(n.length===10)n='52'+n;return n;}
function fechaHoy(){const d=new Date();const m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();}
function setStatus(msg,color){const s=document.getElementById('status');s.textContent=msg;s.style.color=color||'#6B6B6B';}

function generarVoucher(){
  const nombreRaw=document.getElementById('inp-nombre').value.trim();
  if(!nombreRaw){alert('Ingresa el nombre del cliente');return;}
  nombreActual=capitalizar(nombreRaw);

  const qrDiv=document.getElementById('qrcode-hidden');
  qrDiv.innerHTML='';
  const msgQR=encodeURIComponent('Hola Mudanzas Express, deseo canjear mi bono de descuento del 10% en mi próxima mudanza.');
  new QRCode(qrDiv,{
    text:'https://wa.me/52'+TEL_ANDREA+'?text='+msgQR,
    width:140,height:140,
    colorDark:AZUL,colorLight:'#ffffff',
    correctLevel:QRCode.CorrectLevel.M
  });

  setTimeout(()=>{
    const logo=new Image();
    logo.onload=()=>dibujarCanvas(logo);
    logo.onerror=()=>dibujarCanvas(null);
    logo.src=LOGO_SRC;
  },300);
}

function dibujarCanvas(logoImg){
  const canvas=document.getElementById('voucher-canvas');
  const ctx=canvas.getContext('2d');
  const W=600,H=920;
  canvas.width=W;canvas.height=H;

  // Fondo
  ctx.fillStyle=CREMA;
  ctx.beginPath();ctx.roundRect(0,0,W,H,24);ctx.fill();

  // ── HEADER AZUL ──
  ctx.fillStyle=AZUL;
  ctx.beginPath();ctx.roundRect(0,0,W,195,{upperLeft:24,upperRight:24,lowerLeft:0,lowerRight:0});ctx.fill();

  // Círculo decorativo naranja
  ctx.fillStyle='rgba(232,119,34,0.15)';
  ctx.beginPath();ctx.arc(W+20,-20,160,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.05)';
  ctx.beginPath();ctx.arc(-30,180,120,0,Math.PI*2);ctx.fill();

  // Logo centrado en header
  if(logoImg){
    ctx.drawImage(logoImg,W/2-75,10,150,150);
  }

  // Línea naranja decorativa
  ctx.fillStyle=NARANJA;
  ctx.fillRect(0,192,W,4);

  // ── BORDE DENTADO ──
  ctx.fillStyle=CREMA;
  ctx.beginPath();ctx.moveTo(0,196);
  const ondas=30,aw=W/ondas;
  for(let i=0;i<ondas;i++){ctx.quadraticCurveTo((i+0.5)*aw,182,(i+1)*aw,196);}
  ctx.lineTo(W,230);ctx.lineTo(0,230);ctx.closePath();ctx.fill();

  // Badge 10% — naranja
  ctx.fillStyle=NARANJA;
  ctx.shadowColor='rgba(232,119,34,0.3)';ctx.shadowBlur=20;
  ctx.beginPath();ctx.roundRect(34,215,W-68,58,12);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='white';
  ctx.font='bold 34px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('🎉  10% DE DESCUENTO  🎉',W/2,254);
  ctx.textAlign='left';

  // ── SECCIÓN BONO ──
  ctx.fillStyle='#8899BB';
  ctx.font='600 14px -apple-system,sans-serif';
  ctx.fillText('PARA',36,302);

  ctx.fillStyle=NEGRO;
  ctx.font='bold 48px -apple-system,sans-serif';
  ctx.fillText(nombreActual.toUpperCase(),36,355);

  ctx.fillStyle='#555';
  ctx.font='19px -apple-system,sans-serif';
  ctx.fillText('Gracias por confiar en nosotros para tu mudanza.',36,395);
  ctx.fillText('Este bono es tuyo — úsalo tú o regálaselo',36,420);
  ctx.fillText('a quien lo necesite.',36,445);

  // Badge transferible — azul claro
  ctx.fillStyle='#E8EEF8';
  ctx.beginPath();ctx.roundRect(34,462,W-68,44,22);ctx.fill();
  ctx.strokeStyle='#B0C0DC';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=AZUL;
  ctx.font='bold 16px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('🎁  Transferible — compártelo con quien quieras',W/2,490);
  ctx.textAlign='left';

  // QR centrado — azul
  const qrImg=document.querySelector('#qrcode-hidden img');
  if(qrImg){
    ctx.fillStyle='white';
    ctx.beginPath();ctx.roundRect(W/2-80,510,160,160,12);ctx.fill();
    ctx.strokeStyle='#B0C0DC';ctx.lineWidth=2;ctx.stroke();
    ctx.drawImage(qrImg,W/2-70,520,140,140);
  }
  ctx.fillStyle='#8899BB';
  ctx.font='14px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('Escanea para canjear tu bono por WhatsApp',W/2,688);
  ctx.textAlign='left';

  // ── SEPARADOR ──
  ctx.fillStyle=NARANJA;ctx.fillRect(34,708,W-68,2);

  // Sección reseña
  ctx.fillStyle=AZUL;
  ctx.font='bold 19px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('⭐ ¿Nos regalas 1 minuto?',W/2,742);
  ctx.fillStyle='#555';
  ctx.font='16px -apple-system,sans-serif';
  ctx.fillText('Déjanos una reseña en Google — nos ayuda mucho',W/2,766);
  ctx.fillText('a que más familias nos encuentren.',W/2,788);
  ctx.fillStyle=NARANJA;
  ctx.font='bold 15px -apple-system,sans-serif';
  ctx.fillText('👉 g.page/r/CS8SybZrAq2xEAE/review',W/2,812);
  ctx.textAlign='left';

  // ── FOOTER AZUL OSCURO ──
  ctx.fillStyle=AZUL;
  ctx.beginPath();ctx.roundRect(0,H-90,W,90,{upperLeft:0,upperRight:0,lowerLeft:24,lowerRight:24});ctx.fill();

  // Línea naranja en footer
  ctx.fillStyle=NARANJA;ctx.fillRect(0,H-90,W,3);

  const fi=[{label:'TELÉFONO',val:'55 3111 3181'},{label:'SERVICIO',val:fechaHoy()},{label:'VIGENCIA',val:'Sin límite'}];
  const colW=W/3;
  fi.forEach((item,i)=>{
    const x=i*colW+28;
    ctx.fillStyle='rgba(255,255,255,0.45)';ctx.font='600 11px -apple-system,sans-serif';ctx.fillText(item.label,x,H-60);
    ctx.fillStyle='white';ctx.font='600 15px -apple-system,sans-serif';ctx.fillText(item.val,x,H-36);
  });

  canvas.style.display='block';
  document.getElementById('acciones').style.display='flex';
  setStatus('✓ Bono generado para '+nombreActual,'#1B3F7A');
}

function descargarImagen(){
  const canvas=document.getElementById('voucher-canvas');
  const nombre=nombreActual.replace(/\s+/g,'');
  const esIphone=/iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(esIphone){
    const dataUrl=canvas.toDataURL('image/jpeg',0.95);
    let modal=document.getElementById('img-modal');
    if(!modal){modal=document.createElement('div');modal.id='img-modal';modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.93);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:20px;box-sizing:border-box;overflow-y:auto;';document.body.appendChild(modal);}
    modal.innerHTML='<div style="background:#1B3F7A;color:white;padding:14px 20px;border-radius:12px;font-family:sans-serif;font-size:15px;text-align:center;max-width:320px;line-height:1.6;margin-top:10px;">📸 <strong>Mantén presionada la imagen</strong><br>Elige <strong>"Añadir a Fotos"</strong></div><img src="'+dataUrl+'" style="max-width:100%;border-radius:12px;" alt="Bono"/><button onclick="document.getElementById(\'img-modal\').style.display=\'none\'" style="background:white;color:#1B3F7A;border:none;border-radius:10px;padding:14px 40px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:20px;">← Regresar</button>';
    modal.style.display='flex';
    setStatus('iPhone: mantén presionada → Añadir a Fotos','#1B3F7A');
  } else {
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=nombre+'_BONO.jpg';a.style.display='none';
      document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
      setStatus('✓ Guardado: '+nombre+'_BONO.jpg en Descargas','#1B3F7A');
    },'image/jpeg',0.95);
  }
}

window.onload = function() {
  // Pre-cargar logo
  const logoEl = document.getElementById('logo-img');
  if (logoEl) logoEl.src = LOGO_SRC;

  // Pre-cargar datos del cliente desde el registro de servicio
  try {
    const srv = JSON.parse(sessionStorage.getItem('mex_srv') || 'null');
    if (srv) {
      if (srv.nombre) document.getElementById('inp-nombre').value = srv.nombre;
      if (srv.tel)    document.getElementById('inp-tel').value    = srv.tel.replace(/\D/g, '').slice(-10);
    }
  } catch(e) {}
};

// Pre-cargar datos del cliente desde el registro de servicio
window.addEventListener('load', function() {
  try {
    const srv = JSON.parse(sessionStorage.getItem('mex_srv') || 'null');
    if (srv) {
      if (srv.nombre) document.getElementById('inp-nombre').value = srv.nombre;
      if (srv.tel)    document.getElementById('inp-tel').value    = srv.tel.replace(/[^0-9]/g, '').slice(-10);
    }
  } catch(e) {}
});
</script>
</body>
