<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bono Mudanzas Express</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--rojo:#E8402A;--negro:#1A1A1A;--crema:#FAF7F2;--gris:#6B6B6B;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0EDE8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;gap:1.2rem;}
  h1{font-size:1.5rem;font-weight:800;color:var(--negro);letter-spacing:1px;text-align:center;}
  .panel{background:white;border-radius:16px;padding:1.4rem 1.6rem;width:100%;max-width:480px;box-shadow:0 2px 12px rgba(0,0,0,0.08);display:flex;flex-direction:column;gap:0.9rem;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;}
  label{font-size:0.7rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:0.3rem;}
  input{width:100%;border:1.5px solid #E0DDD8;border-radius:8px;padding:0.65rem 0.9rem;font-size:1rem;color:var(--negro);outline:none;font-family:inherit;}
  input:focus{border-color:var(--rojo);}
  .btn-gen{background:var(--rojo);color:white;border:none;border-radius:10px;padding:0.85rem;font-size:1.1rem;font-weight:800;cursor:pointer;width:100%;letter-spacing:1px;}
  /* Preview canvas */
  .preview{width:100%;max-width:480px;}
  canvas#voucher-canvas{width:100%;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.15);display:none;}
  /* QR oculto para generar */
  #qr-hidden{position:absolute;left:-9999px;top:0;}
  /* Acciones */
  .acciones{display:flex;flex-direction:column;gap:0.7rem;width:100%;max-width:480px;}
  .btn{padding:0.8rem 1rem;border-radius:10px;border:none;font-size:0.95rem;font-weight:700;cursor:pointer;width:100%;}
  .btn-img{background:var(--rojo);color:white;font-size:1rem;}
  .btn-wa{background:#25D366;color:white;}
  .btn-resena{background:#4285F4;color:white;}
  .status{font-size:0.85rem;text-align:center;min-height:1.2rem;font-weight:600;padding:0 1rem;}
</style>
</head>
<body>

<h1>🚛 Bono Mudanzas Express</h1>

<div class="panel">
  <div class="row">
    <div>
      <label>Nombre del cliente</label>
      <input type="text" id="inp-nombre" placeholder="Carlos Martínez" autofocus>
    </div>
    <div>
      <label>Teléfono WhatsApp</label>
      <input type="tel" id="inp-tel" placeholder="5514120283">
    </div>
  </div>
  <button class="btn-gen" onclick="generarVoucher()">⚡ GENERAR BONO</button>
</div>

<div class="preview">
  <canvas id="voucher-canvas" width="1000" height="580"></canvas>
</div>

<div id="qr-hidden"><div id="qrcode-hidden"></div></div>

<div class="status" id="status"></div>

<div class="acciones" id="acciones" style="display:none">
  <button class="btn btn-img" onclick="descargarImagen()">📸 Guardar imagen (WhatsApp)</button>
  <button class="btn btn-wa" onclick="enviarWA()">💬 Enviar mensaje de bono</button>
</div>

const ROJO = '#E8402A';
const NEGRO = '#1A1A1A';
const CREMA = '#FAF7F2';

let nombreActual = '';
let telActual = '';

function capitalizar(s){
  return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
}
function limpiarTel(t){
  let n=t.replace(/\D/g,'');
  if(n.length===10)n='52'+n;
  return n;
}
function fechaHoy(){
  const d=new Date();
  const m=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear();
}
function setStatus(msg,color){
  const s=document.getElementById('status');
  s.textContent=msg;
  s.style.color=color||'#6B6B6B';
}

function generarVoucher(){
  const nombreRaw=document.getElementById('inp-nombre').value.trim();
  const tel=document.getElementById('inp-tel').value.trim();
  if(!nombreRaw){alert('Ingresa el nombre del cliente');return;}

  nombreActual=capitalizar(nombreRaw);
  telActual=limpiarTel(tel);

  // Generar QR primero, luego dibujar canvas
  const qrDiv=document.getElementById('qrcode-hidden');
  qrDiv.innerHTML='';
  const msgQR=encodeURIComponent('Hola Mudanzas Express, deseo canjear mi bono de descuento del 10% en mi próxima mudanza.');
  new QRCode(qrDiv,{
    text:'https://wa.me/525548137259?text='+msgQR,
    width:140,height:140,
    colorDark:'#1A1A1A',colorLight:'#ffffff',
    correctLevel:QRCode.CorrectLevel.M
  });

  // Esperar QR y logo
  setTimeout(()=>{
    const logo=new Image();
    logo.onload=()=>dibujarCanvas(logo);
    logo.onerror=()=>dibujarCanvas(null);
    logo.src=LOGO_SRC;
  },300);
}

function dibujarCanvas(logoImg){
  const canvas=document.getElementById('voucher-canvas');
  const ctx=canvas.getContext('2d');
  // Vertical — formato móvil
  const W=600, H=900;
  canvas.width=W; canvas.height=H;

  // Fondo crema
  ctx.fillStyle=CREMA;
  ctx.beginPath();
  ctx.roundRect(0,0,W,H,24);
  ctx.fill();

  // ── HEADER ROJO ──
  ctx.fillStyle=ROJO;
  ctx.beginPath();
  ctx.roundRect(0,0,W,180,{upperLeft:24,upperRight:24,lowerLeft:0,lowerRight:0});
  ctx.fill();

  // Círculo decorativo
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath();
  ctx.arc(W-30,30,120,0,Math.PI*2);
  ctx.fill();

  // Logo
  if(logoImg){ ctx.drawImage(logoImg,28,24,110,110); }

  // Texto MUDANZAS EXPRESS
  ctx.fillStyle='white';
  ctx.font='bold 42px -apple-system,sans-serif';
  ctx.fillText('MUDANZAS EXPRESS',150,75);
  ctx.font='500 17px -apple-system,sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.72)';
  ctx.fillText('PETÉN 227  ·  NARVARTE  ·  CDMX',152,105);

  // Badge 10%
  ctx.fillStyle='white';
  ctx.shadowColor='rgba(0,0,0,0.18)';
  ctx.shadowBlur=16;
  ctx.beginPath();
  ctx.roundRect(150,120,260,50,12);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle=ROJO;
  ctx.font='bold 28px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('10% DESCUENTO',280,152);
  ctx.textAlign='left';

  // ── BORDE DENTADO ──
  ctx.fillStyle=CREMA;
  ctx.beginPath();
  ctx.moveTo(0,180);
  const ondas=30, aw=W/ondas;
  for(let i=0;i<ondas;i++){
    ctx.quadraticCurveTo((i+0.5)*aw,165,(i+1)*aw,180);
  }
  ctx.lineTo(W,220);ctx.lineTo(0,220);
  ctx.closePath();
  ctx.fill();

  // ── SECCIÓN BONO ──
  ctx.fillStyle='#aaa';
  ctx.font='600 15px -apple-system,sans-serif';
  ctx.fillText('PARA',36,248);

  ctx.fillStyle=NEGRO;
  ctx.font='bold 50px -apple-system,sans-serif';
  ctx.fillText(nombreActual.toUpperCase(),36,305);

  ctx.fillStyle='#555';
  ctx.font='20px -apple-system,sans-serif';
  ctx.fillText('Gracias por confiar en nosotros para tu mudanza.',36,345);
  ctx.fillText('Este bono es tuyo — úsalo tú o regálaselo',36,372);
  ctx.fillText('a quien lo necesite.',36,399);

  // Badge transferible
  ctx.fillStyle='#FFF3E0';
  ctx.beginPath();
  ctx.roundRect(34,418,W-68,44,22);
  ctx.fill();
  ctx.strokeStyle='#FFCC80';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle='#E65100';
  ctx.font='bold 17px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('🎁  Transferible — compártelo con quien quieras',W/2,446);
  ctx.textAlign='left';

  // QR centrado
  const qrImg=document.querySelector('#qrcode-hidden img');
  if(qrImg){
    ctx.fillStyle='white';
    ctx.beginPath();
    ctx.roundRect(W/2-80,476,160,160,12);
    ctx.fill();
    ctx.strokeStyle='#E0DDD8';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.drawImage(qrImg,W/2-70,486,140,140);
  }
  ctx.fillStyle='#999';
  ctx.font='15px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('Escanea para canjear tu bono por WhatsApp',W/2,656);
  ctx.textAlign='left';

  // ── SEPARADOR RESEÑA ──
  ctx.fillStyle='#E0DDD8';
  ctx.fillRect(34,676,W-68,1);

  // Sección reseña Google
  ctx.fillStyle='#4285F4';
  ctx.font='bold 20px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('⭐ ¿Nos regalas 1 minuto?',W/2,710);
  ctx.fillStyle='#555';
  ctx.font='17px -apple-system,sans-serif';
  ctx.fillText('Déjanos una reseña en Google — nos ayuda mucho',W/2,736);
  ctx.fillText('a que más familias nos encuentren.',W/2,760);
  ctx.fillStyle='#4285F4';
  ctx.font='bold 16px -apple-system,sans-serif';
  ctx.fillText('👉 g.page/r/CUeLgNoQOI9_EAE/review',W/2,788);
  ctx.textAlign='left';

  // ── FOOTER NEGRO ──
  ctx.fillStyle=NEGRO;
  ctx.beginPath();
  ctx.roundRect(0,H-90,W,90,{upperLeft:0,upperRight:0,lowerLeft:24,lowerRight:24});
  ctx.fill();

  const fi=[
    {label:'TELÉFONO',val:'55 4813 7259'},
    {label:'SERVICIO',val:fechaHoy()},
    {label:'VIGENCIA',val:'Sin límite'}
  ];
  const colW=W/3;
  fi.forEach((item,i)=>{
    const x=i*colW+28;
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='600 11px -apple-system,sans-serif';
    ctx.fillText(item.label,x,H-60);
    ctx.fillStyle='white';
    ctx.font='600 16px -apple-system,sans-serif';
    ctx.fillText(item.val,x,H-36);
  });

  canvas.style.display='block';
  document.getElementById('acciones').style.display='flex';
  setStatus('✓ Bono generado para '+nombreActual,'#1D9E75');
}

function descargarImagen(){
  const canvas=document.getElementById('voucher-canvas');
  const nombre=nombreActual.replace(/\s+/g,'');
  const esIphone=/iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(esIphone){
    // iPhone: modal dentro de la misma página — no pierde el contexto
    const dataUrl=canvas.toDataURL('image/jpeg',0.95);
    let modal=document.getElementById('img-modal');
    if(!modal){
      modal=document.createElement('div');
      modal.id='img-modal';
      modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.93);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:20px;box-sizing:border-box;overflow-y:auto;';
      document.body.appendChild(modal);
    }
    modal.innerHTML=
      '<div style="background:#E8402A;color:white;padding:14px 20px;border-radius:12px;font-family:sans-serif;font-size:15px;text-align:center;max-width:320px;line-height:1.6;margin-top:10px;">'+
      '📸 <strong>Mantén presionada la imagen</strong><br>Elige <strong>"Añadir a Fotos"</strong><br><span style="font-size:13px;opacity:0.85">Luego envíala por WhatsApp desde tu Carrete</span></div>'+
      '<img src="'+dataUrl+'" style="max-width:100%;border-radius:12px;display:block;" alt="Bono"/>'+
      '<button onclick="document.getElementById(\'img-modal\').style.display=\'none\'" '+
      'style="background:white;color:#1A1A1A;border:none;border-radius:10px;padding:14px 40px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:20px;">'+
      '← Regresar al generador</button>';
    modal.style.display='flex';
    setStatus('Mantén presionada la imagen → Añadir a Fotos → enviar por WhatsApp','#E8402A');
  } else {
    // Android / PC: descarga directa
    canvas.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=nombre+'_BONO.jpg';
      a.style.display='none';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
      setStatus('✓ Guardado: '+nombre+'_BONO.jpg en Descargas','#1D9E75');
    },'image/jpeg',0.95);
  }
}

    'Presiona la siguiente liga y en menos de 1 minuto puedes dejarnos tu comentario:\n'+
    '👉 https://g.page/r/CUeLgNoQOI9_EAE/review\n\n'+
    '¡Muchas gracias! — Equipo Mudanzas Express 🚛'

function enviarWA(){
  const tel=limpiarTel(document.getElementById('inp-tel').value);
  if(!tel||tel.length<12){alert('Ingresa el teléfono del cliente');return;}
  const msg=encodeURIComponent(
    'Hola '+nombreActual+'! 🎁\n\n'+
    'Gracias por tu mudanza con Mudanzas Express.\n\n'+
    'Te enviamos tu bono especial de 10% de descuento.\n'+
    'Es transferible: úsalo tú o regálaselo a quien quieras.\n'+
    'Sin fecha de vencimiento.\n\n'+
    'Para canjearlo escríbenos:\n'+
    'Tel: 55 4813 7259\n\n'+
    'Mudanzas Express · Petén 227, Narvarte CDMX\n\n'+
    '—\n\n'+
    '⭐ ¿Nos regalas 1 minuto?\n\n'+
    'Tu opinión nos ayuda mucho a que más familias encuentren un servicio confiable.\n\n'+
    'Presiona la siguiente liga y en menos de 1 minuto puedes dejarnos tu reseña en Google:\n'+
    '👉 https://g.page/r/CUeLgNoQOI9_EAE/review\n\n'+
    '¡Muchas gracias! — Equipo Mudanzas Express 🚛'
  );
  window.open('https://wa.me/'+tel+'?text='+msg,'_blank');
}

// Pre-cargar datos del cliente desde el registro de servicio
window.addEventListener('load', function() {
  try {
    const srv = JSON.parse(sessionStorage.getItem('mex_srv') || 'null');
    if (srv) {
      if (srv.nombre) document.getElementById('inp-nombre').value = srv.nombre;
      if (srv.tel)    document.getElementById('inp-tel').value    = srv.tel.replace(/[^0-9]/g, '').slice(-10);
    }
  } catch(e) {}
});
</script>
